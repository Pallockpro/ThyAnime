name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick base path
        run: |
          # USER.github.io repos and custom domains live at "/", project sites at "/REPO"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io || -f CNAME || -f public/CNAME ]]; then BP=""; else BP="/$REPO"; fi
          echo "NEXT_PUBLIC_BASE_PATH=$BP" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_API_BASE=${{ vars.API_BASE || 'https://api.thyanime.me' }}" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
